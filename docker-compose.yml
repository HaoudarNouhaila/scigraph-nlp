# API + Streamlit UI + Neo4j. Trained models are mounted read-only from ./models.
#   cp .env.example .env   (set NEO4J_PASSWORD)
#   docker compose up --build
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SCIGRAPH_NER_DIR: /app/models/ner
      SCIGRAPH_RE_DIR: /app/models/re
      SCIGRAPH_EXTRACTOR: ${SCIGRAPH_EXTRACTOR:-auto}
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SCIGRAPH_NER_DIR: /app/models/ner
      SCIGRAPH_RE_DIR: /app/models/re
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8501:8501"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
