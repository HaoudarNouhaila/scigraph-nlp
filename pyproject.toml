[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scigraph-nlp"
version = "0.1.0"
description = "Automated scientific knowledge graph construction from abstracts and papers with SciBERT-based entity and relation extraction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nouhaila Haoudar" }]
dependencies = [
    "torch>=2.1",
    "transformers>=4.44,<5",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "spacy>=3.7,<4",
    "pymupdf>=1.24",
    "neo4j>=5.20",
    "rdflib>=7.0",
    "networkx>=3.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "pandas>=2.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "matplotlib>=3.8"]
shacl = ["pyshacl>=0.25"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "websockets>=12.0",
]

[project.scripts]
scigraph = "scigraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scigraph = ["resources/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Notebook cell sources are kept as written in the notebooks.
"scripts/build_notebooks.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "neo4j: tests that need a running Neo4j instance (skipped otherwise)",
    "slow: tests that load transformer weights",
]
