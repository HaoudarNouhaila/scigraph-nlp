# CPU-constrained relation run. Differences from configs/re.yaml: 5 epochs and
# 1.5 negative pairs per positive pair, resampled every epoch (all pairs are still
# scored at evaluation time).
data_dir: data/processed
output_dir: outputs/re
ner_predictions_dir: outputs/ner
encoder_name: allenai/scibert_scivocab_uncased
max_seq_length: 256
epochs: 5
batch_size: 32
eval_batch_size: 64
encoder_lr: 3.0e-5
head_lr: 1.0e-4
warmup_ratio: 0.1
weight_decay: 0.01
grad_clip: 1.0
seed: 42
fp16: false
save_every: 50
negative_ratio: 1.5
