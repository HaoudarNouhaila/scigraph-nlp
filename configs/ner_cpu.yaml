# CPU-constrained NER run (no GPU available; remote GPU training was declined).
# Differences from configs/ner.yaml: no cross-sentence context (sequences ~3.5x shorter),
# 10 epochs with a higher encoder learning rate to converge within the budget.
data_dir: data/processed
output_dir: outputs/ner
encoder_name: allenai/scibert_scivocab_uncased
max_span_length: 8
context_window: 0
context_words: 0
max_seq_length: 256
epochs: 10
batch_size: 16
encoder_lr: 3.0e-5
head_lr: 5.0e-4
warmup_ratio: 0.1
weight_decay: 0.01
grad_clip: 1.0
seed: 42
fp16: false
save_every: 40
allow_overlap: true
